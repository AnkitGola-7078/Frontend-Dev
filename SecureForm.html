<!--19. Create a web page demonstrating HTML form security attributes:
● Add autocomplete=&quot;off&quot; to the form.
● Use required on all input fields.
Below the form, write a note explaining why turning off autocomplete can improve-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form</title>
</head>
<body>
  <h2>Secure Form</h2>
  <form action="#" method="post" autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <input type="submit" value="Login">
  </form>
  <p>Turning off autocomplete prevents browsers from storing sensitive information, improving security.</p>
</body>
</html>
