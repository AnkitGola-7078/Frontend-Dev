<!--11. Design a form that collects student information — Name, Roll Number, and Course.
Use a &lt;select&gt; dropdown for choosing a course.
Include an option that says “Select Course” as default (disabled and selected).-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Form</title>
</head>
<body>
  <h2>Student Information</h2>
  <form action="#" method="post">
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="roll">Roll Number:</label><br>
    <input type="text" id="roll" name="roll" required><br><br>

    <label for="course">Course:</label><br>
    <select id="course" name="course" required>
      <option selected disabled>Select Course</option>
      <option value="Computer Science">Computer Science</option>
      <option value="Mathematics">Mathematics</option>
      <option value="Physics">Physics</option>
    </select><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
