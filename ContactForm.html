<!--10. Create a Contact Form with the following:
● Full Name
● Email
● Subject
● Message (textarea)
Use the placeholder and required attributes properly.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
</head>
<body>

  <h2>Contact Us</h2>
  <form action="#" method="post">
    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter email" required><br><br>

    <label for="subject">Subject:</label><br>
    <input type="text" id="subject" name="subject" placeholder="Enter subject" required><br><br>

    <label for="message">Message:</label><br>
    <textarea id="message" name="message" placeholder="Enter your message" rows="4" cols="50" required></textarea><br><br>

    <input type="submit" value="Send">
  </form>

</body>
</html>
