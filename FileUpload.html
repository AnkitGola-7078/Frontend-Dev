<!--9. Create a File Upload Form where users can upload only .jpg or .png files.
Use the accept attribute to restrict file types.Include a short note in a &lt;p&gt; tag describing what kind of files are allowed.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload</title>
</head>
<body>
  <h2>Upload an Image</h2>
  <p>Only .jpg and .png files are allowed.</p>
  <form action="#" method="post" enctype="multipart/form-data">
    <label for="image">Choose an image:</label>
    <input type="file" id="image" name="image" accept=".jpg,.png" required><br><br>
    <input type="submit" value="Upload">
  </form>
</body>
</html>
