<!--16. Create a webpage that demonstrates URI encoding.
Add a hyperlink that includes special characters in its URL, for example:
https://example.com/search?query=HTML &amp; CSS
Write the correct encoded version of this link using %20 for spaces.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URI Encoding</title>
</head>
<body>
  <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML &amp; CSS</a>
</body>
</html>
