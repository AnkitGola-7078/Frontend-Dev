<!--15. Create a Payment Form with fields for:
● Cardholder Name
● Card Number
● Expiry Date
● CVV
Add the required attribute to all fields and include a “Pay Now” button.-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Form</title>
</head>
<body>
  <h2>Payment</h2>
  <form action="#" method="post">
    <label for="cardholder">Cardholder Name:</label><br>
    <input type="text" id="cardholder" name="cardholder" required><br><br>

    <label for="cardnumber">Card Number:</label><br>
    <input type="text" id="cardnumber" name="cardnumber" required><br><br>

    <label for="expiry">Expiry Date:</label><br>
    <input type="month" id="expiry" name="expiry" required><br><br>

    <label for="cvv">CVV:</label><br>
    <input type="number" id="cvv" name="cvv" required><br><br>

    <input type="submit" value="Pay Now">
  </form>
</body>
</html>
