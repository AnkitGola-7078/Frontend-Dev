<!--4. Create a frameset layout using &lt;frameset&gt; and &lt;frame&gt; tags:
● Top frame → Navigation links (Home, About, Contact)
● Bottom frame → Displays a message “Welcome to My Website”
(Use only HTML — no CSS.)-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frameset Example</title>
</head>
<frameset rows="100,*">
  <frame src="navigation.html" name="nav">
  <frame src="welcome.html" name="main">
</frameset>
</html>
